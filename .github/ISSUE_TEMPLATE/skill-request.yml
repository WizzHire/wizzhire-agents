name: Request a skill
description: A job you would like Claude to do in WizzHire.
labels: [skill request]
body:
  - type: textarea
    id: job
    attributes:
      label: What job should Claude do?
      description: The task in your own words, and how often you do it.
      placeholder: Every Monday I check which candidates have not heard from us in a week...
    validations:
      required: true
  - type: textarea
    id: ask
    attributes:
      label: How would you ask for it?
      placeholder: '"Who have we not answered in a week?"'
  - type: dropdown
    id: module
    attributes:
      label: Which part of WizzHire?
      options:
        - ATS (hiring)
        - HR
        - CRM
        - Not sure
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
